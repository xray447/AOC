[package]
name = "aoc-client"
version = "0.1.0"
description = "AOC 模拟飞行运行中心（个人模式）"
authors = ["AOC"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# docs/12 §6：到达提醒的 Windows 系统通知（Rust 侧轮询通知队列后弹出）
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
